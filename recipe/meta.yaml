{% set name = "python-cudnn-frontend" %}
{% set version = "1.28.0" %}
{% set build_num = 0 %}
{% set cuda_major = (cuda_compiler_version or "12").split('.')[0] %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/NVIDIA/cudnn-frontend/archive/v{{ version }}.tar.gz
  sha256: c4c2be237f282d67abee8141b321eee2930464f8a7b3cecb3c3c59e431afa37f
  patches:
    - patches/0001-unvendor-dependencies-dlpack-pybind.patch
    - patches/0002-fix-windows-cuda-library-load.patch

build:
  number: {{ build_num }}
  string: cuda{{ cuda_compiler_version | replace('.', '') }}_py{{ CONDA_PY }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  skip: true # [cuda_compiler_version in (undefined, "None") or osx or (win and (cuda_compiler_version or "12").startswith("12"))]
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}
    - {{ stdlib("c") }}
    - cmake >=3.18
    - make # [linux]
    - ninja-base >=1.11.1.1
  host:
    - cuda-version =={{ cuda_compiler_version }}
    - cuda-nvrtc-dev
    # provides cuda_runtime_api.h, needed by NVRTC JIT compilation at runtime (causal_conv1d)
    - cuda-cudart-dev
    - cudnn
    # required by some runtime modules
    - cuda-bindings {{ cuda_major }}.*
    # dlpack version is listed here: https://github.com/NVIDIA/cudnn-frontend/blob/develop/dlpack_version.txt
    - dlpack ==1.3
    - pip
    - pybind11 >=2.13,<3
    - pybind11-abi
    - python
    - setuptools >=64
  run:
    - python
    # pinned by run_exports
    - cudnn
    - cuda-bindings
    - cuda-cudart-dev
    - __cuda
  run_constrained:
    - apache-tvm-ffi >=0.1.11
    - cutile-python >=1.4

test:
  source_files:
    - test/python
  requires:
    - pip
    - pytest
    - looseversion
    - pytorch
  imports:
    - cudnn
  commands:
    - pip check

about:
  home: https://github.com/NVIDIA/cudnn-frontend
  summary: cuDNN FrontEnd API
  description: |
    cuDNN Frontend is NVIDIA's modern, open-source entry point to the cuDNN
    library and a growing collection of high-performance open-source
    kernels — scaled dot-product attention (SDPA / Flash Attention),
    grouped GEMM fusions for Mixture-of-Experts (MoE) training, fused
    normalization + activation, and more.
  license: MIT
  license_file:
    - LICENSE.txt
    - include/cudnn_frontend/thirdparty/nlohmann/LICENSE.MIT
  license_family: MIT
  doc_url: https://docs.nvidia.com/deeplearning/cudnn/latest/
  dev_url: https://github.com/NVIDIA/cudnn-frontend


extra:
  recipe-maintainers:
    - jameslamb
    - weiji14
